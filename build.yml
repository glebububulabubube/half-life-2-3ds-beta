name: Build HL-DEMO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Install makerom (binary)
        run: |
          mkdir -p /usr/local/bin
          curl -L -o /usr/local/bin/makerom https://github.com/3DSGuy/Project_CTR/releases/download/v0.18.1/makerom_lnx_v18.zip
          echo "downloaded, now extracting"
          cd /tmp && unzip -o /usr/local/bin/makerom
          mv /tmp/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          makerom --version || true

      - name: Build
        run: make

      - name: Upload CIA + 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: hl-demo-3ds
          path: |
            *.cia
            *.3dsx
