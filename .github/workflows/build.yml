name: Build HL-DEMO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    defaults:
      run:
        shell: bash -l {0}
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Upload CIA + 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: hl-demo-3ds
          path: |
            *.cia
            *.3dsx
